    <meta property="og:title" content="مستخرج الدفاتر اليدوية إلى SQL Server" />
    <meta property="og:description" content="تطبيق ذكي لقراءة صور الدفاتر والسجلات اليدوية بالذكاء الاصطناعي وتعيين واستيراد البيانات تلقائياً في جداول SQL Server." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // HMR is disabled in AI Studio - suppress WebSocket module transport errors
      window.addEventListener('error', function(event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
           event.message.includes('createWebSocketModuleRunnerTransport') ||
           event.filename?.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = String(event.reason || '');
        if (
          reason.includes('WebSocket') ||
          reason.includes('createWebSocketModuleRunnerTransport') ||
          reason.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-['Cairo',sans-serif] min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
